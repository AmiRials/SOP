<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title id="pageTitle">คู่มือการใช้งาน AmiRials</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #18181b;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #tabContent img {
            max-width: 100% !important;
            width: auto !important;
            height: auto !important;
            display: block;
            margin: 1.25rem auto;
            border-radius: 0.75rem;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        mark.search-highlight {
            background-color: #f97316;
            color: #ffffff;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-zinc-900 text-white min-h-screen antialiased selection:bg-orange-500 selection:text-white">

    <!-- แถบเมนูด้านบน -->
    <header class="sticky top-0 z-30 bg-zinc-900/95 backdrop-blur-md border-b border-zinc-800 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <a href="https://amirials.github.io/app/" 
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white text-sm font-medium shadow-sm transition-all shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>ย้อนกลับ</span>
            </a>

            <!-- ช่องค้นหาข้อความ -->
            <div class="relative flex-1 min-w-[200px] max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-zinc-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)"
                    placeholder="ค้นหาข้อความในคู่มือ..."
                    class="w-full pl-9 pr-8 py-2 bg-zinc-800 border border-zinc-700 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 rounded-xl text-sm text-white placeholder-zinc-400 outline-none transition">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-zinc-400 hover:text-white">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- พื้นที่เนื้อหาหลัก -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-8">
        <div class="bg-zinc-800 rounded-2xl shadow-xl border border-zinc-700/80 overflow-hidden">
            
            <!-- หัวข้อเอกสาร -->
            <div class="p-5 sm:p-7 border-b border-zinc-700 bg-zinc-800/90 flex flex-wrap items-center justify-between gap-2">
                <h1 id="docTitle" class="text-xl sm:text-2xl md:text-3xl font-bold text-white leading-snug">
                    กำลังโหลด...
                </h1>
                <span class="inline-flex items-center gap-1.5 text-xs font-medium text-orange-300 bg-orange-500/10 border border-orange-500/30 px-3 py-1 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                    เรียลไทม์
                </span>
            </div>

            <!-- แถบเลือกแท็บเมนูอัตโนมัติ -->
            <div id="tabMenuWrapper" class="hidden border-b border-zinc-700 bg-zinc-800/60 px-4 sm:px-7 pt-3.5">
                <div id="tabMenu" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3.5"></div>
            </div>

            <!-- สถานะกำลังโหลด -->
            <div id="loadingIndicator" class="p-12 sm:p-16 flex flex-col items-center justify-center text-center">
                <div class="w-10 h-10 border-4 border-zinc-600 border-t-orange-500 rounded-full animate-spin mb-4"></div>
                <p class="text-white font-medium">กำลังโหลด...</p>
            </div>

            <!-- กล่องแจ้งเตือนเมื่อโหลดไม่สำเร็จ -->
            <div id="errorBox" class="hidden p-8 sm:p-12 text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-orange-500/20 text-orange-400 mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h2 class="text-lg font-semibold text-white mb-1">ไม่สามารถโหลดข้อมูลได้</h2>
                <p class="text-sm text-zinc-300 max-w-md mx-auto mb-5">
                    กรุณาโหลดใหม่อีกครั้งภายหลัง
                </p>
                <button onclick="fetchDocumentData()" class="px-5 py-2.5 bg-orange-600 hover:bg-orange-500 text-white text-sm font-medium rounded-xl shadow transition">
                    ลองโหลดใหม่อีกครั้ง
                </button>
            </div>

            <!-- พื้นที่แสดงผลการค้นหา -->
            <div id="searchResultsBox" class="hidden p-5 sm:p-8 text-white"></div>

            <!-- พื้นที่แสดงเนื้อหาของแท็บที่เลือก -->
            <div id="tabContent" class="p-5 sm:p-8 text-base sm:text-[17px] text-white bg-zinc-800"></div>

            <!-- ส่วนท้ายหน้า: ปุ่ม Like / Dislike และปุ่มเลื่อนขึ้นบนสุด -->
            <div id="bottomBar" class="hidden px-5 sm:px-8 py-6 bg-zinc-800/95 border-t border-zinc-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
                    <span class="text-sm text-zinc-300">เนื้อหานี้มีประโยชน์ไหมครับ?</span>
                    <div class="flex items-center gap-2">
                        <button id="likeBtn" onclick="handleFeedback('like')" 
                            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2m0下のv5a2 2 0 01-2 2h-.5c-.51 0-.905.19-1.165.523l-1.835 2.398a2 2 0 00-.332 1.107V20h8.667a2 2 0 001.97-1.604l1.25-6.25A2 2 0 0016.5 10H14z" />
                            </svg>
                            <span id="likeCount">0</span>
                        </button>
                        <button id="dislikeBtn" onclick="handleFeedback('dislike')" 
                            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018c.163 0 .326.02.485.06L17 4m-7 10v5a2 2 0 002 2m0-0v-5a2 2 0 012-2h.5c.51 0 .905-.19 1.165-.523l1.835-2.398a2 2 0 00.332-1.107V4H7.334a2 2 0 00-1.97 1.604l-1.25 6.25A2 2 0 007.5 14H10z" />
                            </svg>
                            <span id="dislikeCount">0</span>
                        </button>
                    </div>
                </div>

                <button onclick="scrollToTop()" class="w-full sm:w-auto inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white text-sm font-medium shadow transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                    </svg>
                    <span>เลื่อนขึ้นบนสุด</span>
                </button>
            </div>

        </div>
    </main>

    <!-- ปุ่มลอยเลื่อนขึ้นบนสุด -->
    <button id="floatingTopBtn" onclick="scrollToTop()" title="เลื่อนขึ้นบนสุด"
        class="fixed bottom-6 right-6 z-40 hidden items-center justify-center w-12 h-12 rounded-full bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white shadow-lg shadow-black/40 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
    </button>

        <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw-KFYGODiQByRq-GvGTXAbOCCylBUOED_utB9toFT21YabqF7Feka95y8_umDNaHq-/exec";
        let allTabsData = []; // เก็บ id, title และ content (ถ้าโหลดแล้ว)
        let currentTabIndex = 0;
        let feedbackData = JSON.parse(localStorage.getItem('doc_feedback') || '{}');

        async function fetchDocumentData() {
            const loadingEl = document.getElementById('loadingIndicator');
            const errorEl = document.getElementById('errorBox');

            loadingEl.classList.remove('hidden');
            errorEl.classList.add('hidden');

            try {
                // ยิงครั้งแรก: ได้รายชื่อแท็บ + เนื้อหาแท็บแรกทันที ไม่ต้องรอนาน 30 วิ
                const response = await fetch(API_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                allTabsData = data.tabs || [];

                // ใส่ content แท็บแรกลงใน cache ทันที
                if (allTabsData.length > 0) {
                    allTabsData[0].content = data.initialContent;
                }

                document.getElementById('pageTitle').innerText = data.docTitle || "คู่มือการใช้งาน";
                document.getElementById('docTitle').innerText = data.docTitle || "คู่มือการใช้งาน";
                
                loadingEl.classList.add('hidden');
                renderFastUI(allTabsData);
            } catch (error) {
                console.error('Error fetching data:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        function renderFastUI(tabsData) {
            const tabMenuWrapper = document.getElementById('tabMenuWrapper');
            const tabMenu = document.getElementById('tabMenu');
            const tabContent = document.getElementById('tabContent');
            const bottomBar = document.getElementById('bottomBar');
            
            tabMenu.innerHTML = '';
            tabContent.innerHTML = '';
            
            if (!tabsData || tabsData.length === 0) {
                tabContent.innerHTML = '<p class="text-center text-zinc-400 py-8">ไม่พบเนื้อหาในเอกสาร</p>';
                return;
            }

            // 1. สร้างปุ่มเมนูด้านบนทั้งหมดทันที
            tabsData.forEach((tab, index) => {
                const isFirst = index === 0;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `tab-btn-${index}`;
                btn.className = isFirst 
                    ? 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-orange-600 text-white shadow-md ring-2 ring-orange-400/50'
                    : 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-orange-600/40 hover:bg-orange-600/80 text-white border border-orange-500/30';
                btn.innerText = tab.title;
                btn.onclick = () => selectTab(index);
                tabMenu.appendChild(btn);
            });

            // 2. แสดงเนื้อหาแท็บแรกทันที
            const firstPane = document.createElement('div');
            firstPane.id = `tab-0`;
            firstPane.className = 'tab-pane block animate-fade-in';
            firstPane.innerHTML = tabsData[0].content || '';
            tabContent.appendChild(firstPane);

            tabMenuWrapper.classList.remove('hidden');
            bottomBar.classList.remove('hidden');
            updateFeedbackUI(0);
        }

        // เมื่อคลิกเลือกแท็บเมนูอื่น: ถ้ายังไม่เคยโหลดเนื้อหา ให้ดึงเฉพาะแท็บนั้นแบบ Asynchronous
        async function selectTab(index) {
            currentTabIndex = index;
            if (document.getElementById('searchInput').value.trim() !== '') {
                clearSearch(false);
            }

            // สลับสถานะ Active ของปุ่มเมนู
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((b, idx) => {
                if (idx === index) {
                    b.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-orange-600 text-white shadow-md ring-2 ring-orange-400/50';
                } else {
                    b.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-orange-600/40 hover:bg-orange-600/80 text-white border border-orange-500/30';
                }
            });

            const tabContent = document.getElementById('tabContent');
            let pane = document.getElementById(`tab-${index}`);

            // ถ้ายังไม่มีแท็บนี้ใน DOM
            if (!pane) {
                pane = document.createElement('div');
                pane.id = `tab-${index}`;
                pane.className = 'tab-pane hidden';
                tabContent.appendChild(pane);
            }

            // ซ่อนทุกหน้าก่อน
            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(p => {
                p.classList.add('hidden');
                p.classList.remove('block', 'animate-fade-in');
            });

            // ตรวจสอบว่ามีเนื้อหาใน Cache หรือยัง
            const tabData = allTabsData[index];
            if (!tabData.content) {
                // แสดงสถานะหมุนรอเฉพาะในแท็บนี้
                pane.innerHTML = `
                    <div class="py-12 flex flex-col items-center justify-center text-center">
                        <div class="w-8 h-8 border-3 border-zinc-600 border-t-orange-500 rounded-full animate-spin mb-3"></div>
                        <p class="text-zinc-400 text-sm">กำลังโหลดเนื้อหาหัวข้อนี้...</p>
                    </div>
                `;
                pane.classList.remove('hidden');
                pane.classList.add('block');

                try {
                    const res = await fetch(`${API_URL}?tabId=${encodeURIComponent(tabData.id)}`, {
                        method: 'GET',
                        redirect: 'follow'
                    });
                    const result = await res.json();
                    tabData.content = result.content; // บันทึกลง cache จะได้ไม่ต้องโหลดซ้ำ
                    pane.innerHTML = tabData.content;
                    pane.classList.add('animate-fade-in');
                } catch (e) {
                    pane.innerHTML = '<p class="text-center text-orange-400 py-6">เกิดข้อผิดพลาดในการโหลดเนื้อหา กรุณาลองใหม่อีกครั้ง</p>';
                }
            } else {
                pane.innerHTML = tabData.content;
                pane.classList.remove('hidden');
                pane.classList.add('block', 'animate-fade-in');
            }

            updateFeedbackUI(index);
        }

        function handleFeedback(type) {
            const tabKey = `tab_${currentTabIndex}`;
            if (!feedbackData[tabKey]) {
                feedbackData[tabKey] = { likes: 0, dislikes: 0, userVote: null };
            }

            const currentVote = feedbackData[tabKey].userVote;

            if (currentVote === type) {
                feedbackData[tabKey][type + 's']--;
                feedbackData[tabKey].userVote = null;
            } else {
                if (currentVote) {
                    feedbackData[tabKey][currentVote + 's']--;
                }
                feedbackData[tabKey][type + 's']++;
                feedbackData[tabKey].userVote = type;
            }

            localStorage.setItem('doc_feedback', JSON.stringify(feedbackData));
            updateFeedbackUI(currentTabIndex);
        }

        function updateFeedbackUI(index) {
            const tabKey = `tab_${index}`;
            const data = feedbackData[tabKey] || { likes: 0, dislikes: 0, userVote: null };

            document.getElementById('likeCount').innerText = data.likes;
            document.getElementById('dislikeCount').innerText = data.dislikes;

            const likeBtn = document.getElementById('likeBtn');
            const dislikeBtn = document.getElementById('dislikeBtn');

            if (data.userVote === 'like') {
                likeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-orange-600 text-white text-xs font-medium shadow-md transition-all border border-orange-400';
                dislikeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600';
            } else if (data.userVote === 'dislike') {
                dislikeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-orange-600 text-white text-xs font-medium shadow-md transition-all border border-orange-400';
                likeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600';
            } else {
                likeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600';
                dislikeBtn.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-zinc-700 hover:bg-orange-600 text-white text-xs font-medium transition-all border border-zinc-600';
            }
        }

        function handleSearch(keyword) {
            const query = keyword.trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            const searchResultsBox = document.getElementById('searchResultsBox');
            const tabContent = document.getElementById('tabContent');

            if (query.length === 0) {
                clearSearch();
                return;
            }

            clearBtn.classList.remove('hidden');
            tabContent.classList.add('hidden');
            searchResultsBox.classList.remove('hidden');

            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            let resultsHtml = `<div class="mb-4 pb-2 border-b border-zinc-700 flex items-center justify-between">
                <span class="text-sm text-orange-400 font-medium">ผลการค้นหาสำหรับ "${query}"</span>
            </div>`;
            let matchCount = 0;

            allTabsData.forEach((tab, index) => {
                let plainText = "";
                if (tab.content) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = tab.content;
                    plainText = tempDiv.innerText || tempDiv.textContent || "";
                }

                if (tab.title.toLowerCase().includes(query.toLowerCase()) || (plainText && plainText.toLowerCase().includes(query.toLowerCase()))) {
                    matchCount++;
                    let snippetHtml = "";
                    if (plainText) {
                        const lines = plainText.split('\n').filter(line => line.trim().length > 0);
                        const matchedLines = lines.filter(line => line.toLowerCase().includes(query.toLowerCase()));
                        snippetHtml = matchedLines.slice(0, 3).map(line => {
                            const highlighted = line.replace(regex, '<mark class="search-highlight">$1</mark>');
                            return `<p class="text-sm text-zinc-200 mt-1.5 leading-relaxed">${highlighted}</p>`;
                        }).join('');
                    }

                    if (!snippetHtml) {
                        snippetHtml = `<p class="text-sm text-zinc-300 mt-1">พบคำค้นหาในชื่อหัวข้อแท็บนี้</p>`;
                    }

                    resultsHtml += `
                        <div class="mb-4 p-4 rounded-xl bg-zinc-700/60 border border-zinc-600 hover:border-orange-500 transition">
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <span class="text-base font-semibold text-orange-400">${tab.title.replace(regex, '<mark class="search-highlight">$1</mark>')}</span>
                                <button onclick="goToTabFromSearch(${index})" class="px-3 py-1.5 rounded-lg bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium shrink-0 transition">
                                    เปิดอ่านหน้านี้ &rarr;
                                </button>
                            </div>
                            ${snippetHtml}
                        </div>
                    `;
                }
            });

            if (matchCount === 0) {
                resultsHtml += `<div class="py-10 text-center text-zinc-400">ไม่พบข้อความที่ตรงกับ "<span class="text-white">${query}</span>"</div>`;
            }

            searchResultsBox.innerHTML = resultsHtml;
        }

        function goToTabFromSearch(index) {
            clearSearch(false);
            selectTab(index);
            scrollToTop();
        }

        function clearSearch(restoreCurrentTab = true) {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            document.getElementById('searchResultsBox').classList.add('hidden');
            document.getElementById('tabContent').classList.remove('hidden');
            if (restoreCurrentTab) {
                selectTab(currentTabIndex);
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const floatingBtn = document.getElementById('floatingTopBtn');
            if (window.scrollY > 250) {
                floatingBtn.classList.remove('hidden');
                floatingBtn.classList.add('flex');
            } else {
                floatingBtn.classList.add('hidden');
                floatingBtn.classList.remove('flex');
            }
        });

        fetchDocumentData();
    </script>
</body>
</html>
